name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npx vite build

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        # The Azure Ubuntu mirror sometimes stalls on large packages
        # (libwebkit2gtk); fail fast on a stalled download and retry.
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf"
          # Only the download is time-limited: killing dpkg mid-install would break the retries.
          for i in 1 2 3; do
            sudo apt-get $APT update &&
            timeout 300 sudo apt-get $APT install -y --download-only --no-install-recommends $PKGS && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          sudo apt-get $APT install -y --no-install-recommends $PKGS
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test --lib commands::portal_http::tests
        working-directory: src-tauri
