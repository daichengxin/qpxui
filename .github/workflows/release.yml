name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on Apple Silicon runners; the Intel build
          # cross-compiles (macos-13 Intel runners are retired and never start).
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        # The Azure Ubuntu mirror sometimes stalls on large packages
        # (libwebkit2gtk); fail fast on a stalled download and retry.
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf"
          # Only the download is time-limited: killing dpkg mid-install would break the retries.
          for i in 1 2 3; do
            sudo apt-get $APT update &&
            timeout 300 sudo apt-get $APT install -y --download-only --no-install-recommends $PKGS && break
            [ "$i" = 3 ] && exit 1
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          sudo apt-get $APT install -y --no-install-recommends $PKGS

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_targets }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QPX UI ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform from the assets below.

            - **macOS**: `*_aarch64.dmg` (Apple Silicon) or `*_x64.dmg` (Intel). The app is not notarized yet; on first launch right-click → Open, or run `xattr -dr com.apple.quarantine /Applications/qpxui.app`.
            - **Windows**: `*_x64-setup.exe` or `*.msi`.
            - **Linux**: `*.AppImage`, `*.deb` or `*.rpm`.

            See the [README](https://github.com/bigbio/qpxui#readme) for features and usage.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
