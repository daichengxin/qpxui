[package]
name = "qpxui"
version = "0.2.0"
license = "Apache-2.0"
description = "Local desktop viewer for the QPX (Quantitative Proteomics eXchange) format"
edition = "2021"
rust-version = "1.77"

[lib]
name = "qpxui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"

# Async runtime needed for the S3 commands (Tauri manages a tokio runtime).
httpdate = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "net", "time", "sync"] }

# AWS S3 (rustls, no OpenSSL needed).
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
futures = "0.3"

# Local HTTP range proxy that lets DuckDB-wasm stream S3 objects lazily.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
lru = "0.18"

log = "0.4"
env_logger = "0.11"

# HTTP client for the public quantms portal (browse.quantms.org) example source.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "rustls-tls", "json", "stream"] }
rustls-native-certs = "0.8.5"

# Free disk space on the cache volume, checked before big downloads.
fs4 = "0.13"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
# ring provider only (no aws-lc-rs) so the TLS test doesn't drag in cmake/nasm on CI.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
